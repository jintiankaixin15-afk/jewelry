<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BETTER JEWELRY 款式报价系统 V7</title>
<style>
:root{--main:#18b7ae;--blue:#2f80ed;--bg:#f6f7f9;--text:#222;--muted:#8b8b8b;--line:#e5e5e5;--orange:#f39a4a}.dark{--bg:#111;--text:#f5f5f5;--line:#333;--muted:#aaa}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;text-align:center;font-weight:700;font-size:19px}.bar{display:flex;gap:10px;padding:12px;background:#fff}.search{flex:1;border:0;background:#f0f1f3;border-radius:22px;padding:12px 16px;font-size:16px}.btn{border:0;border-radius:12px;background:var(--main);color:#fff;padding:10px 14px;font-size:15px;font-weight:600}.btn.gray{background:#eee;color:#333}.btn.blue{background:var(--blue)}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;padding:10px 18px;border-radius:10px;background:#eee;font-size:16px}.tab.active{background:#eafffd;color:var(--main);font-weight:700;border:1px solid var(--main)}.goldPanel{margin:10px 12px;background:#fff;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:0 2px 8px #0000000c}.goldPanel input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px}.hint{color:var(--muted);font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 5px #00000012;position:relative}.card img{width:100%;height:170px;object-fit:cover;background:#fafafa}.card .noimg{height:170px;display:flex;align-items:center;justify-content:center;color:#aaa;background:#fafafa}.cardBody{padding:10px}.name{font-size:15px;line-height:1.35;height:41px;overflow:hidden}.meta{font-size:12px;color:var(--muted);margin-top:4px}.price{font-size:18px;color:var(--orange);font-weight:700;margin-top:6px}.cost{font-size:12px;color:var(--muted)}.delete{position:absolute;right:6px;top:6px;background:#0008;color:#fff;border:0;border-radius:50%;width:26px;height:26px}.detail{display:none}.section{background:#fff;margin:10px 0;padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:90px 1fr 30px;align-items:center;gap:6px;margin:6px 0}.row input,.row select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}.sheet{font-size:14px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.formGrid .row{grid-template-columns:82px 1fr 18px}.resultBox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{background:#f9fffe;border:1px solid #bff0eb;border-radius:10px;padding:12px;text-align:center}.result b{display:block;color:var(--orange);font-size:20px;margin-top:5px}.bigImg{width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}.photoStrip{display:flex;gap:8px;overflow:auto}.photoStrip img{width:150px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 env(safe-area-inset-bottom)}.nav{font-size:12px;text-align:center;color:#777;padding:6px}.nav.active{color:var(--main);font-weight:700}.fab{position:fixed;right:16px;bottom:88px;border:0;background:var(--main);color:#fff;border-radius:50%;width:58px;height:58px;font-size:30px;box-shadow:0 4px 15px #0003}.brandGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}.brand{height:145px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;font-weight:700}.brand small{font-size:14px;margin-top:14px;font-weight:400}.modal{position:fixed;inset:0;background:#0007;z-index:99;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}.sheet h3{margin:0 0 12px}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#fff}.editBlock{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;background:#fff}.editBlock h4{margin:0 0 8px;color:var(--main);font-size:15px}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.editGrid .row{grid-template-columns:72px 1fr 12px;margin:3px 0}.editGrid input{padding:7px!important;font-size:13px!important}.fullRow{grid-column:1/-1}.miniHint{font-size:12px;color:var(--muted);line-height:1.4}.noteBox{width:100%;min-height:120px;resize:vertical;line-height:1.5}.sizeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sizeCell{display:grid;grid-template-columns:36px 1fr;gap:4px;align-items:center;font-size:12px}.sizeCell input{padding:6px!important;font-size:13px!important}.selectRow{display:grid;grid-template-columns:72px 1fr 12px;align-items:center;gap:6px;margin:3px 0} .tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#fff}.pill{padding:8px 12px;background:#eee;border-radius:999px;font-size:14px}.pill.active{background:var(--main);color:#fff}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.card img,.card .noimg{height:210px}body{max-width:980px;margin:auto}.bottom{max-width:980px;margin:auto}.fab{right:calc((100vw - 980px)/2 + 16px)}}
</style>
</head><body>
<header id="title">BETTER JEWELRY 报价系统</header>
<div id="home" class="page">
  <div class="bar"><input id="search" class="search" placeholder="搜索品牌 / 款号 / 分类"><button class="btn blue" onclick="openModal()">新增</button></div>
  <div class="goldPanel"><div><label>实时/手动金价 元/g</label><input id="goldPrice" type="number" step="0.01"><div class="hint">所有款式会自动按这个金价重算</div></div><div><label>默认利润%</label><input id="defaultProfit" type="number" step="0.1"><div class="hint">售价=成本÷(1-利润%)，单款可改</div></div></div>
  <div class="tabs" id="brandTabs"></div><div class="tools" id="catTabs"></div><div class="grid" id="cards"></div>
</div>
<div id="brands" class="page" style="display:none"><div class="brandGrid" id="brandGrid"></div></div>
<div id="detail" class="detail page"></div>
<button class="fab" onclick="openModal()">＋</button>
<div class="bottom"><div class="nav active" onclick="showPage('home')">首页</div><div class="nav" onclick="showPage('brands')">品牌</div><div class="nav" onclick="exportData()">导出</div><div class="nav" onclick="document.getElementById('importFile').click()">导入</div></div><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
<div class="modal" id="modal"><div class="sheet"><h3>新增/编辑款式</h3><div id="form"></div><button class="btn" style="width:100%;margin-top:10px" onclick="saveForm()">保存款式</button><button class="btn gray" style="width:100%;margin-top:10px" onclick="closeModal()">取消</button></div></div>
<script>
const LS='betterJewelryCatalogV3';let editId=null;let state=JSON.parse(localStorage.getItem(LS)||'null')||{goldPrice:762.5,defaultProfit:30,brand:'全部',cat:'全部',items:[
{id:uid(),brand:'卡地亚',cat:'手镯',name:'KDY-B6048617 头尾镶钻钉子手镯 客版',goldWeight:30,partWeight:0,wastage:11,mainCt:0,mainCtPrice:0,mainQty:0,mainSet:0,smallCt1:0.59,smallPrice1:350,smallCt2:0,smallPrice2:300,smallCt3:0,smallPrice3:400,smallCt4:0,smallPrice4:400,customCt:0,customPrice:0,microQty:32,microSet:3,otherQty:0,otherSet:0,labor:450,plate:0,accessory:0,other:0,profit:30,sizeType:'bracelet',selectedSize:'17',sizeWeights:{'15':28,'16':29,'17':30,'18':31,'19':32,'20':33},imgs:[]},
{id:uid(),brand:'宝格丽',cat:'戒指',name:'BVL-Serpenti 蛇形戒指 18K',goldWeight:8.5,partWeight:0,wastage:12,labor:260,profit:35,sizeType:'ring',selectedSize:'52',sizeWeights:{'50':8.1,'51':8.3,'52':8.5,'53':8.7,'54':8.9,'55':9.1,'56':9.3,'57':9.5,'58':9.7,'59':9.9,'60':10.1,'61':10.3},imgs:[]},
{id:uid(),brand:'梵克雅宝',cat:'项链',name:'VCA 四叶草项链 定制款',goldWeight:6.2,partWeight:1,wastage:10,labor:180,profit:30,imgs:[]}
]};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(LS,JSON.stringify(state))}
function n(v){return parseFloat(v)||0}function money(v){return (Math.round(v*100)/100).toFixed(2)}function escapeHtml(t){return String(t||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function getSizeOptions(type){if(type==='bracelet')return ['15','16','17','18','19','20']; if(type==='ring')return Array.from({length:12},(_,i)=>String(50+i)); return []}
function detectSizeType(it){let t=it.sizeType||''; if(t)return t; let c=String(it.cat||''); if(c.includes('手镯'))return 'bracelet'; if(c.includes('戒指'))return 'ring'; return 'none'}
function getActiveGoldWeight(it){let type=detectSizeType(it); let sz=it.selectedSize; if(type!=='none' && sz && it.sizeWeights && it.sizeWeights[sz]!==undefined && it.sizeWeights[sz]!=='' ) return n(it.sizeWeights[sz]); return n(it.goldWeight)}
function calc(it){let gp=n(state.goldPrice), gw=getActiveGoldWeight(it), gold=(gw+n(it.partWeight))*(1+n(it.wastage)/100)*gp;let main=n(it.mainCt)*n(it.mainCtPrice);let mainSet=n(it.mainQty)*n(it.mainSet);let small=n(it.smallCt1)*n(it.smallPrice1)+n(it.smallCt2)*n(it.smallPrice2)+n(it.smallCt3)*n(it.smallPrice3)+n(it.smallCt4)*n(it.smallPrice4)+n(it.customCt)*n(it.customPrice);let set=n(it.microQty)*n(it.microSet)+n(it.otherQty)*n(it.otherSet);let total=gold+main+mainSet+small+set+n(it.labor)+n(it.plate)+n(it.accessory)+n(it.other);let profit=n(it.profit??state.defaultProfit);let price=profit>=100?total:total/(1-profit/100);return{gold,main,mainSet,small,set,total,price}}
function render(){document.getElementById('goldPrice').value=state.goldPrice;document.getElementById('defaultProfit').value=state.defaultProfit;let brands=['全部',...new Set(state.items.map(i=>i.brand||'未分类'))];brandTabs.innerHTML=brands.map(b=>`<div class="tab ${state.brand==b?'active':''}" onclick="state.brand='${b}';save();render()">${b}</div>`).join('');let cats=['全部',...new Set(state.items.map(i=>i.cat||'未分类'))];catTabs.innerHTML=cats.map(c=>`<div class="pill ${state.cat==c?'active':''}" onclick="state.cat='${c}';save();render()">${c}</div>`).join('');let q=search.value.trim().toLowerCase();let arr=state.items.filter(i=>(state.brand=='全部'||i.brand==state.brand)&&(state.cat=='全部'||i.cat==state.cat)&&((i.name+i.brand+i.cat).toLowerCase().includes(q)));cards.innerHTML=arr.map(i=>{let c=calc(i);return `<div class="card" onclick="openDetail('${i.id}')"><button class="delete" onclick="event.stopPropagation();del('${i.id}')">×</button>${(i.imgs&&i.imgs[0])?`<img src="${i.imgs[0]}">`:(i.img?`<img src="${i.img}">`:`<div class="noimg">上传图片</div>`)}<div class="cardBody"><div class="name">${i.name||'未命名款式'}</div><div class="meta">${i.brand||''} · ${i.cat||''} · 金重${getActiveGoldWeight(i)}g${i.selectedSize?'｜尺寸'+i.selectedSize:''}</div><div class="price">¥${money(c.price)}</div><div class="cost">成本 ¥${money(c.total)}｜金价 ${state.goldPrice}/g</div></div></div>`}).join('')||'<p style="padding:20px;color:#999">暂无款式，点右下角新增</p>';brandGrid.innerHTML=brands.filter(b=>b!='全部').map(b=>`<div class="brand" onclick="state.brand='${b}';showPage('home');render()">${b}<small>${state.items.filter(i=>i.brand==b).length} 个款式</small></div>`).join('')}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.style.display='none');document.getElementById(p).style.display=p=='detail'?'block':'block';document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active')); if(p=='home')document.querySelectorAll('.nav')[0].classList.add('active'); if(p=='brands')document.querySelectorAll('.nav')[1].classList.add('active');title.textContent=p=='brands'?'品牌':p=='home'?'BETTER JEWELRY 报价系统':'款式详情'}
function openDetail(id){let i=state.items.find(x=>x.id==id),c=calc(i);detail.innerHTML=`<div class="bar"><button class="btn gray" onclick="showPage('home')">返回</button><button class="btn" onclick="openModal('${id}')">编辑</button><button class="btn blue" onclick="copyItem('${id}')">复制</button></div><div class="section"><h2>${i.name}</h2>${(i.imgs&&i.imgs.length)?`<div class="photoStrip">${i.imgs.map(x=>`<img src="${x}">`).join('')}</div>`:(i.img?`<img class="bigImg" src="${i.img}">`:'')}<p>${i.brand} · ${i.cat}</p></div><div class="section resultBox"><div class="result">金值<b>¥${money(c.gold)}</b></div><div class="result">主石石价<b>¥${money(c.main)}</b></div><div class="result">副石石价<b>¥${money(c.small)}</b></div><div class="result">总镶工费<b>¥${money(c.set+c.mainSet)}</b></div><div class="result">最终售价<b>¥${money(c.price)}</b></div></div><div class="section"><h3>明细</h3><p>尺寸：${i.selectedSize||'未选'}，主体金重：${getActiveGoldWeight(i)}g，配件：${n(i.partWeight)}g，损耗：${n(i.wastage)}%，金价：${state.goldPrice}/g</p><p>主石：${n(i.mainCt)}ct × ¥${n(i.mainCtPrice)}/ct = ¥${money(c.main)}；主石镶工：${n(i.mainQty)}粒 × ¥${n(i.mainSet)} = ¥${money(c.mainSet)}</p><p>工费：¥${n(i.labor)}，版费：¥${n(i.plate)}，配件：¥${n(i.accessory)}，其他：¥${n(i.other)}</p><p>成本：¥${money(c.total)}，利润：${n(i.profit??state.defaultProfit)}%</p>${i.note?`<div style="margin-top:12px;padding:12px;background:#fffaf2;border:1px solid #ffe0b5;border-radius:10px;white-space:pre-wrap"><b>备注 / 正品数据：</b><br>${escapeHtml(i.note)}</div>`:''}</div>`;showPage('detail')}
const baseFields=[['brand','品牌','text'],['cat','分类','text'],['name','款号/名称','text']];
const goldFields=[['goldWeight','主体金重','number'],['partWeight','配件重','number'],['wastage','损耗%','number']];
const mainFields=[['mainCt','主石ct','number'],['mainCtPrice','主石单价/ct','number'],['mainQty','主石粒数','number'],['mainSet','主石镶工/粒','number']];
const smallFields=[['smallCt1','5分以下ct','number'],['smallPrice1','5分以下单价','number'],['smallCt2','5-7分ct','number'],['smallPrice2','5-7分单价','number'],['customCt','自定义副石ct','number'],['customPrice','自定义单价','number'],['microQty','微镶粒数','number'],['microSet','微镶单价','number'],['otherQty','其他镶粒数','number'],['otherSet','其他镶单价','number']];
const feeFields=[['labor','工费','number'],['plate','版费','number'],['accessory','配件费用','number'],['other','其他费用','number'],['profit','利润%','number']];
const fields=[...baseFields,...goldFields,...mainFields,...smallFields,...feeFields];
function block(title, arr){return `<div class="editBlock"><h4>${title}</h4><div class="editGrid">`+arr.map(f=>`<div class="row ${f[0]=='name'?'fullRow':''}"><label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]}" value="${currentFormItem[f[0]]??''}"><span></span></div>`).join('')+'</div></div>'}
let currentFormItem={};
function sizeBlock(it){let type=detectSizeType(it);let opts=getSizeOptions(type);if(!it.sizeWeights) it.sizeWeights={};return `<div class="editBlock"><h4>尺寸 / 对应金重</h4><div class="editGrid"><div class="selectRow fullRow"><label>类型</label><select id="f_sizeType" onchange="refreshSizeInputs()"><option value="none" ${type==='none'?'selected':''}>不使用尺寸</option><option value="ring" ${type==='ring'?'selected':''}>戒指 50-61</option><option value="bracelet" ${type==='bracelet'?'selected':''}>手镯 15-20圈口</option></select><span></span></div><div class="selectRow fullRow"><label>当前尺寸</label><select id="f_selectedSize" onchange="applySelectedSizeWeight()">${opts.map(o=>`<option value="${o}" ${String(it.selectedSize||'')===o?'selected':''}>${o}</option>`).join('')}</select><span></span></div></div><div class="miniHint">先给每个尺寸预填主体金重，选择尺寸后会自动把对应重量用于报价。没有填写时仍使用下面的主体金重。</div><div id="sizeInputs" class="sizeGrid" style="margin-top:8px">${opts.map(o=>`<div class="sizeCell"><b>${o}</b><input id="sw_${o}" type="number" step="0.01" value="${it.sizeWeights[o]??''}" placeholder="g"></div>`).join('')}</div></div>`}
function refreshSizeInputs(){let type=document.getElementById('f_sizeType').value; let opts=getSizeOptions(type);let ss=document.getElementById('f_selectedSize'); ss.innerHTML=opts.map(o=>`<option value="${o}">${o}</option>`).join('');document.getElementById('sizeInputs').innerHTML=opts.map(o=>`<div class="sizeCell"><b>${o}</b><input id="sw_${o}" type="number" step="0.01" value="" placeholder="g"></div>`).join('')}
function applySelectedSizeWeight(){let sz=document.getElementById('f_selectedSize')?.value; let inp=document.getElementById('sw_'+sz); let gw=document.getElementById('f_goldWeight'); if(inp&&gw&&inp.value!=='')gw.value=inp.value}
function openModal(id){editId=id||null;let it=id?state.items.find(x=>x.id==id):{brand:'卡地亚',cat:'戒指',wastage:11,profit:state.defaultProfit};currentFormItem=it;form.innerHTML='<div class="editBlock"><h4>图片 / 品牌 / 分类 / 名称</h4><div class="row" style="grid-template-columns:72px 1fr 12px"><label>多张图片</label><input id="f_img" type="file" accept="image/*" multiple><span></span></div><div class="miniHint">可一次选择多张图片。重新选择图片会替换原图片。</div><div class="editGrid">'+baseFields.map(f=>`<div class="row ${f[0]=='name'?'fullRow':''}"><label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]}" value="${it[f[0]]??''}"><span></span></div>`).join('')+'</div></div>'+sizeBlock(it)+block('主体金重 / 配件重 / 损耗',goldFields)+block('主石费用：会计入总成本',mainFields)+block('副石 / 镶嵌费用',smallFields)+block('工费 / 版费 / 利润',feeFields)+`<div class="editBlock"><h4>备注 / 正品数据</h4><textarea id="f_note" class="noteBox" placeholder="例如：正品金重、专柜尺寸、原版钻石数据、客户要求、改版记录……">${it.note||''}</textarea><div class="miniHint">这个备注只保存在你的本地数据里，方便记录正品资料。</div></div>`;modal.style.display='flex'}function closeModal(){modal.style.display='none'}
function saveForm(){let it=editId?state.items.find(x=>x.id==editId):{id:uid(),imgs:[]};fields.forEach(f=>it[f[0]]=document.getElementById('f_'+f[0]).value);it.sizeType=document.getElementById('f_sizeType')?document.getElementById('f_sizeType').value:'none';it.selectedSize=document.getElementById('f_selectedSize')?document.getElementById('f_selectedSize').value:'';it.sizeWeights={};getSizeOptions(it.sizeType).forEach(o=>{let el=document.getElementById('sw_'+o);it.sizeWeights[o]=el?el.value:''});if(it.selectedSize && it.sizeWeights[it.selectedSize])it.goldWeight=it.sizeWeights[it.selectedSize];it.note=document.getElementById('f_note')?document.getElementById('f_note').value:'';it.smallCt3=0;it.smallPrice3=0;it.smallCt4=0;it.smallPrice4=0;function done(){if(!editId)state.items.unshift(it);save();closeModal();render();if(editId)openDetail(editId)} let files=[...document.getElementById('f_img').files];if(files.length){it.imgs=[];let left=files.length;files.forEach(file=>{let r=new FileReader();r.onload=e=>{it.imgs.push(e.target.result);if(--left===0)done()};r.readAsDataURL(file)})}else done()}
function del(id){if(confirm('删除这个款式？')){state.items=state.items.filter(i=>i.id!=id);save();render()}}function copyItem(id){let old=state.items.find(i=>i.id==id);let nw=JSON.parse(JSON.stringify(old));nw.id=uid();nw.name=nw.name+' 副本';state.items.unshift(nw);save();render();openDetail(nw.id)}
goldPrice.oninput=()=>{state.goldPrice=n(goldPrice.value);save();render()};defaultProfit.oninput=()=>{state.defaultProfit=n(defaultProfit.value);save();render()};search.oninput=render;
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='better-jewelry-data.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{state=JSON.parse(x.target.result);save();render();alert('导入成功')};r.readAsText(f)}
render();
</script></body></html>
